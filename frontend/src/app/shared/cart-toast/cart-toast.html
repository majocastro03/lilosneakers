@if (visible()) {
  <div class="cart-toast" role="status" aria-live="polite">
    <span class="cart-toast__icon">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
      </svg>
    </span>

    <div class="cart-toast__info">
      <span class="cart-toast__added">✓ ¡Añadido al carrito!</span>
      <span class="cart-toast__count">
        {{ cartService.totalItems() }} {{ cartService.totalItems() === 1 ? 'producto' : 'productos' }}
      </span>
    </div>

    <div class="cart-toast__total">
      <span class="cart-toast__price">COP {{ cartService.totalPrice() | number:'1.0-0' }}</span>
      <span class="cart-toast__label">Total</span>
    </div>

    <button type="button" class="cart-toast__cta" (click)="irAlCarrito()">Ir al carrito ›</button>

    <button type="button" class="cart-toast__close" (click)="cerrar()" aria-label="Cerrar aviso">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
}
